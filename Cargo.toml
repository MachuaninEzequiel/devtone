[workspace]
resolver = "2"
members = [
    "crates/devtone-core",
    "crates/devtone-engine",
    "crates/devtone-tui",
    "crates/devtone-notch",
    "crates/devtone",
    "crates/devtone-sensors",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lofi daemon + local coding-agent telemetry"
repository = "https://github.com/MachuaninEzequiel/devtone"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devtone-core = { path = "crates/devtone-core" }
